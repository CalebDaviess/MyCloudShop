name: Deploy CloudCart Azure Function

on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Existing Linux Function App name (Python 3.12, Functions v4)
        required: false
        default: Calebpython-function-cd
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0A87DAD93FD543B8A44603950A8F535A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_68C3211BF0DF40A6A2BD8B74753029AA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2204B05486DD458DBEBCC61930083576 }}

      - name: Deploy Function with remote build
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name || 'Calebpython-function-cd' }}
          package: ./azure_function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Connect Function to CloudCart
        env:
          FUNCTION_APP_NAME: ${{ inputs.function_app_name || 'Calebpython-function-cd' }}
          FUNCTION_KEY: ${{ secrets.CLOUDCART_ORDER_FUNCTION_KEY }}
        run: |
          if [[ -z "$FUNCTION_KEY" ]]; then
            echo "Set the CLOUDCART_ORDER_FUNCTION_KEY repository secret before running this workflow." >&2
            exit 1
          fi

          function_url="https://${FUNCTION_APP_NAME}.azurewebsites.net/api/neworder"
          az webapp config appsettings set \
            --name 'firstwebpage-Caleb' \
            --resource-group 'myshop-workshop-rg' \
            --settings \
              "CLOUDCART_ORDER_FUNCTION_URL=$function_url" \
              "CLOUDCART_ORDER_FUNCTION_KEY=$FUNCTION_KEY" \
            --output none

          response=$(curl --silent --show-error --fail \
            --max-time 15 \
            --header "x-functions-key: $FUNCTION_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"event_id":"cloudcart-order-1","order_id":1,"status":"Deployment test","total":0,"currency":"GBP","items":[{"name":"Deployment test","quantity":1,"unit_price":0}]}' \
            "$function_url")
          if [[ "$response" != *'"accepted": true'* && "$response" != *'"accepted":true'* ]]; then
            echo "Function smoke test returned an unexpected response." >&2
            exit 1
          fi
          echo 'Azure Function deployed, key configured in CloudCart, and HTTP smoke test passed.'
