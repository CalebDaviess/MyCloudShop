# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - firstwebpage-Caleb

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Prepare startup script and validate PHP syntax
        shell: bash
        run: |
          sed -i 's/\r$//' startup.sh
          chmod +x startup.sh
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: |
            .
            !azure_function
            !assessemnt brif WRIT1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0A87DAD93FD543B8A44603950A8F535A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_68C3211BF0DF40A6A2BD8B74753029AA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2204B05486DD458DBEBCC61930083576 }}

      - name: Configure PHP runtime
        shell: bash
        run: |
          sed -i 's/\r$//' startup.sh
          chmod +x startup.sh
          az webapp config set \
            --name 'firstwebpage-Caleb' \
            --resource-group 'myshop-workshop-rg' \
            --linux-fx-version 'PHP|8.2' \
            --startup-file '/home/site/wwwroot/startup.sh' \
            --output none

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'firstwebpage-Caleb'
          slot-name: 'Production'
          package: .

      - name: Restart and verify Web App
        shell: bash
        run: |
          az webapp restart --name 'firstwebpage-Caleb' --resource-group 'myshop-workshop-rg' --output none
          for attempt in {1..12}; do
            status=$(curl --silent --location --output /tmp/cloudcart-home.html --write-out '%{http_code}' 'https://firstwebpage-caleb-frc0gzb4abf8ajac.switzerlandnorth-01.azurewebsites.net/home.php' || true)
            if [[ "$status" == "200" ]] && grep -q 'CloudCart' /tmp/cloudcart-home.html; then
              echo "CloudCart live check passed with HTTP $status."
              exit 0
            fi
            echo "Waiting for CloudCart to come online (attempt $attempt, HTTP $status)..."
            sleep 5
          done
          echo "CloudCart did not return HTTP 200 within timeout." >&2
          exit 1
